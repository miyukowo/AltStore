name: Trigger Main Repo Sync

on:
  push:
    paths:
      - 'repo.json'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync workflow in miyukowo/repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/miyukowo/repo/actions/workflows/sync-apps.yml/dispatches \
            -d '{"ref":"main"}'